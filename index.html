<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grocery">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
  <title>Grocery Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="hud">
    <div class="grp">
      <b id="h-day">Day 1</b>
      <span id="h-time" class="time">5:00 AM</span>
      <span id="h-phase" class="pill">Pre-open</span>
    </div>
    <div class="grp stats">
      <span title="Sales vs today's goal">💵 <b id="h-sales">$0</b><small id="h-goal"> / $0</small></span>
      <span title="Customer satisfaction (0–100)">🙂 <b id="h-sat">80</b></span>
      <span title="Labor as % of sales (target 12% or less)">👷 <b id="h-labor">—</b></span>
      <span title="Truck cases left on pallets and floats">🚚 <b id="h-truck">0</b></span>
      <span title="Unread email — read it at the office computer">📧 <b id="h-mail">0</b></span>
      <span title="Today's checklist (office computer → Today)">📋 <b id="h-list">0/0</b></span>
      <button id="btn-pc" title="Where is the computer?">🖥️</button>
    </div>
    <div class="grp">
      <div class="lvl"><span><span id="h-title">Lv 1</span> · <span class="mute">bank</span> <b id="h-bank">$0</b></span><div class="xpbar"><div id="h-xp"></div></div></div>
      <div class="speed">
        <button data-speed="0" title="Pause (P)">⏸</button>
        <button data-speed="1" title="Normal speed (1)">1×</button>
        <button data-speed="2" title="Fast (2)">2×</button>
        <button data-speed="4" title="Faster (3)">4×</button>
      </div>
      <button id="btn-mute" title="Sound on/off (M)" onclick="toggleMute()">🔊</button>
      <button id="btn-home" class="hidden" title="Clock out and go home">🏠</button>
      <button id="btn-endnight" class="primary hidden">End night ▶</button>
    </div>
  </header>
  <div id="stage"><canvas id="c"></canvas><div id="toasts"></div></div>
  <footer id="bar">
    <span id="prompt"></span>
    <span id="holding"></span>
    <span id="ver" class="keys" title="Game version">v0.0.30</span>
    <span class="keys">WASD move · Scroll / +− / Z zoom · Shift run · E interact (hold) · Q 2nd action · M sound · P pause · 1/2/3 speed</span>
  </footer>

  <div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="computer" class="hidden">
    <div class="pc">
      <div class="pc-top"><span>🖥️ StoreNet — Manager Workstation</span><button id="pc-close">✕ Log off (Esc)</button></div>
      <div class="pc-body"><nav id="pc-tabs"></nav><main id="pc-main"></main></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/game.js"></script>
  <script src="js/training.js"></script>
  <script src="js/morale.js"></script>
  <script src="js/events.js"></script>
  <script src="js/labor.js"></script>
  <script src="js/backroom.js"></script>
  <script src="js/birds.js"></script>
  <script src="js/facing.js"></script>
  <script src="js/counts.js"></script>
  <script src="js/damages.js"></script>
  <script src="js/cuts.js"></script>
  <script src="js/recalls.js"></script>
  <script src="js/resets.js"></script>
  <script src="js/endcaps.js"></script>
  <script src="js/timeoff.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/huddle.js"></script>
  <script src="js/perf.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/pnl.js"></script>
  <script src="js/reps.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/render.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/review.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shift.js"></script>
  <script src="js/touch.js"></script>
  <script>boot();</script>
</body>
</html>
